{% extends 'base/base.html' %}
{% load static %}

{% block title %}パスワード変更完了 | DataQuiz AI{% endblock %}

{% block extra_css %}
    <link
        rel="stylesheet"
        href="{% static 'css/accounts.css' %}"
    >
    <link
        rel="stylesheet"
        href="{% static 'css/password_reset.css' %}"
    >
{% endblock %}

{% block header_actions %}
    <a
        class="header-back"
        href="{% url 'quizapp:index' %}"
    >
        TOPへ戻る
    </a>
{% endblock %}

{% block content %}
    <section class="auth-section">

        <div class="auth-card">

            <div class="reset-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <path d="m8 12 3 3 5-6" />
                </svg>
            </div>

            <h1 class="auth-title">
                パスワードを変更しました
            </h1>

            <p class="auth-description">
                新しいパスワードでログインできます。
            </p>

            <a
                class="button button-primary reset-wide-button"
                href="{% url 'accounts:login' %}"
            >
                ログインへ
            </a>

            <a
                class="auth-back"
                href="{% url 'quizapp:index' %}"
            >
                TOPへ戻る
            </a>

        </div>

    </section>
{% endblock %}
